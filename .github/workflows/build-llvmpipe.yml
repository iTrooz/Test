name: build-llvmpipe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: msvc
            llvm_suffix: msvc-x64
            host_triple: x86_64-pc-windows-msvc
            meson_extra: "-Db_vscrt=mt"
            artifact_suffix: msvc-x64
          - compiler: mingw
            llvm_suffix: mingw-x64
            host_triple: x86_64-pc-windows-gnu
            meson_extra: ""
            artifact_suffix: mingw-x64
        llvm_version: ["19.1.7", "20.1.7", "21.1.8", "22.1.8"]
    env:
      MESA_VERSION: "mesa-26.2.0"

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: clone mesa
        shell: bash
        run: git clone --depth 1 --branch "${MESA_VERSION}" https://gitlab.freedesktop.org/mesa/mesa.git mesa

      # --- toolchain setup ---

      - name: setup msvc
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: setup msys2
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-mako
            mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-python-packaging
            mingw-w64-ucrt-x86_64-meson

      # --- install deps ---

      - name: install dependencies (msvc)
        if: matrix.compiler == 'msvc'
        shell: cmd
        run: |
          python -m pip install setuptools meson mako pyyaml
          where python
          curl -sfLO https://github.com/ninja-build/ninja/releases/download/v1.13.1/ninja-win.zip
          tar -xf ninja-win.zip
          echo %CD%>>"%GITHUB_PATH%"
          if not exist winflexbison (
            mkdir winflexbison
            pushd winflexbison
            curl -sfL -o win_flex_bison.zip https://github.com/lexxmark/winflexbison/releases/download/v2.5.24/win_flex_bison-2.5.24.zip
            tar -xf win_flex_bison.zip
            popd
          )
          echo %CD%\winflexbison>>"%GITHUB_PATH%"

      - name: install dependencies (mingw)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: pacman -S --noconfirm --needed msys/flex msys/bison msys/python-yaml

      # --- llvm ---

      - name: restore llvm cache
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: llvm-${{ matrix.llvm_version }}-${{ matrix.llvm_suffix }}
          key: llvm-${{ matrix.llvm_version }}-${{ matrix.llvm_suffix }}

      - name: download llvm prebuilt
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          LLVM="${{ matrix.llvm_version }}"
          curl -sfLO "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM}/clang+llvm-${LLVM}-x86_64-pc-windows-msvc.tar.xz"
          mkdir llvm-extract
          tar -xf "clang+llvm-${LLVM}-x86_64-pc-windows-msvc.tar.xz" -C llvm-extract
          mv llvm-extract/clang+llvm-${LLVM}-x86_64-pc-windows-msvc "llvm-${LLVM}-${{ matrix.llvm_suffix }}"

      - name: save llvm cache
        if: always() && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: llvm-${{ matrix.llvm_version }}-${{ matrix.llvm_suffix }}
          key: llvm-${{ matrix.llvm_version }}-${{ matrix.llvm_suffix }}

      # --- configure + build mesa ---

      - name: configure mesa (msvc)
        if: matrix.compiler == 'msvc'
        shell: cmd
        run: |
          set PATH=%CD%\llvm-${{ matrix.llvm_version }}-msvc-x64\bin;%PATH%

          meson setup ^
            mesa-build ^
            mesa ^
            --prefix="%CD%\mesa-install" ^
            --default-library=static ^
            -Dbuildtype=minsize ^
            -Db_ndebug=true ^
            -Dstrip=true ^
            ${{ matrix.meson_extra }} ^
            -Dcpp_args="/wd4189 /Gy" ^
            -Dc_args="/wd4189 /Gy" ^
            -Dcpp_link_args="/OPT:REF" ^
            -Dc_link_args="/OPT:REF" ^
            -Dllvm=enabled ^
            -Dgallium-drivers=llvmpipe ^
            -Dvulkan-drivers= ^
            -Degl=disabled ^
            -Dgles1=disabled ^
            -Dgles2=disabled ^
            -Dglx=disabled ^
            -Dbuild-tests=false
          if errorlevel 1 exit /b 1

      - name: configure mesa (mingw)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: |
          export PATH="${PWD}/llvm-${{ matrix.llvm_version }}-${{ matrix.llvm_suffix }}/bin:${PATH}"

          meson setup \
            mesa-build \
            mesa \
            --prefix="${PWD}/mesa-install" \
            --default-library=static \
            -Dbuildtype=minsize \
            -Db_ndebug=true \
            -Dstrip=true \
            ${{ matrix.meson_extra }} \
            -Dc_args="-ffunction-sections -fdata-sections" \
            -Dcpp_args="-ffunction-sections -fdata-sections" \
            -Dc_link_args="-Wl,--gc-sections" \
            -Dcpp_link_args="-Wl,--gc-sections" \
            -Dllvm=enabled \
            -Dgallium-drivers=llvmpipe \
            -Dvulkan-drivers= \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Dbuild-tests=false

      - name: build mesa (msvc)
        if: matrix.compiler == 'msvc'
        shell: cmd
        run: |
          set PATH=%CD%\llvm-${{ matrix.llvm_version }}-msvc-x64\bin;%PATH%
          ninja -C mesa-build install
          if errorlevel 1 exit /b 1

      - name: build mesa (mingw)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: |
          export PATH="${PWD}/llvm-${{ matrix.llvm_version }}-${{ matrix.llvm_suffix }}/bin:${PATH}"
          ninja -C mesa-build install

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-llvmpipe-llvm${{ matrix.llvm_version }}-${{ matrix.artifact_suffix }}
          path: |
            mesa-install/bin/opengl32.dll
            mesa-install/bin/libgallium_wgl.dll
          if-no-files-found: error
